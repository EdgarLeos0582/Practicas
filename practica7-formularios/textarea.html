<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

</head>
<body>
	<form action="" method="post">
	<!--Form: inicia el formulario. action: envia los datos a donde se le indique. method="post": envia los datos de forma oculta-->
	Ingresa tu nombre:
	<input type="text" name="nombre">
	<!--input type="text": es para crear el campo a rellenar. name: es como se reconocera el dato-->
	<br>
	Ingresa tu correo:
	<input type="email" name="correo">
	<!--input type="email": crea un espacio que es exclusivo para emails. name: es como se reconocera el dato-->
	<br>
	Ingresa tus comentarios:
	<textarea name="comentarios" rows="1" cols="10"></textarea>}
	<!--textarea: crea el contenedor de texto. name: es como se reconocera el dato. rows="1": es la altura visual de la caja. cols="10": el ancho visual de la caja-->
	<br>
	<input type="submit" value="enviar">
	<!--input type="submit": es crear un boton de envio. value: es el texto que se mostrara en el boton-->
	<input type="reset" value="borrar">
	<!--input type="reset": es para crear un boton que borrara todos los campos. value: es el texto que se mostrara en el boton-->
	</form>
	<!--cierra el formulario-->
</body>
</html>
