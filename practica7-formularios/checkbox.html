<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

</head>
<body>
	<h2>Formularios con checkbox</h2>
	<form action="" method="post">
	<!--Form: inicia el formulario. action: envia los datos a donde se le indique. method="post": envia los datos de forma oculta-->
	Ingresa tu nombre:
	<input type="text" name="nombre">
	<!--input type="text": es para crear el campo a rellenar. name: es como se reconocera el dato-->
	<br>
	Selecciona los lenguajes que conozcas:
	<br>
	<input type="checkbox" name="Java">Java <br>
	<!--input type="checkbox": crea el cuadrado interactivo. name: es como se reconocera el dato-->
	<input type="checkbox" name="Python"> Python <br>
	<!--input type="checkbox": crea el cuadrado interactivo. name: es como se reconocera el dato-->
	<input type="checkbox" name="C#">C# <br>
	<!--input type="checkbox": crea el cuadrado interactivo. name: es como se reconocera el dato-->
	<input type="checkbox" name="Flutter"> Flutter <br>
	<!--input type="checkbox": crea el cuadrado interactivo. name: es como se reconocera el dato-->
	</form>
	<!--cierra el formulario-->
</body>
</html>
