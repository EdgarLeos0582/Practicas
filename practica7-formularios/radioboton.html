<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

</head>
<body>
	<h2>Formularios con Radioboton</h2>
	<form action="" method="post">
	<!--Form: inicia el formulario. action: envia los datos a donde se le indique. method="post": envia los datos de forma oculta-->
	Ingresa tu nombre:
	<input type="text" name="nombre">
	<!--input type="text": es para crear el campo a rellenar. name: es como se reconocera el dato-->
	<br>
	Selecciona el maximo de estudios que tienes:
	<br>
	<input type="radio" name="estudios" value="1">Sin estudios <br>
	<!--input type="radio":crea un circulo interactivo. name: es como se reconocera el dato. value="1": valor oculto que viaja al servidor-->
	<input type="radio" name="estudios" value="2">Primaria <br>
	<!--input type="radio":crea un circulo interactivo. name: es como se reconocera el dato. value="1": valor oculto que viaja al servidor-->
	<input type="radio" name="estudios" value="3">Secundaria <br>
	<!--input type="radio":crea un circulo interactivo. name: es como se reconocera el dato. value="1": valor oculto que viaja al servidor-->
	<input type="radio" name="estudios" value="4">Preparatoria <br>
	<!--input type="radio":crea un circulo interactivo. name: es como se reconocera el dato. value="1": valor oculto que viaja al servidor-->
	<input type="submit" value="enviar">
	<!--input type="submit": es crear un boton de envio. value: es el texto que se mostrara en el boton-->
	<input type="reset" value="borrar">
	<!--input type="reset": es para crear un boton que borrara todos los campos. value: es el texto que se mostrara en el boton-->
	</form>
	<!--cierra el formulario-->
</body>
</html>
