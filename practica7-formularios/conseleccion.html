<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

</head>
<body>
	<h2>Formularios con seleccion</h2>
	<form action="" method="post">
	<!--Form: inicia el formulario. action: envia los datos a donde se le indique. method="post": envia los datos de forma oculta-->
	Ingresa tu nombre:
	<input type="text" name="nombre">
	<!--input type="text": es para crear el campo a rellenar. name: es como se reconocera el dato-->

	<br>
	Selecciona tu pais:
	<select name="pais">
	<!--select: crea la caja del menu desplegable. name: es como se reconocera el dato-->
	<option value="1">Argentina</option>
	<!--option: crea la opcion. value="1": valor oculto que viaja al servidor-->
	<option value="2">España</option>
	<!--option: crea la opcion. value="1": valor oculto que viaja al servidor-->
	<option value="3">Mexico</option>
	<!--option: crea la opcion. value="1": valor oculto que viaja al servidor-->
	<option value="4">Guatemala</option>
	<!--option: crea la opcion. value="1": valor oculto que viaja al servidor-->
	<option value="5">Honduras</option>
	<!--option: crea la opcion. value="1": valor oculto que viaja al servidor-->
	<option value="6">El Salvador</option>
	<!--option: crea la opcion. value="1": valor oculto que viaja al servidor-->
	<option value="7">Venezuela</option>
	<!--option: crea la opcion. value="1": valor oculto que viaja al servidor-->
	<option value="8">Colombia</option>
	<!--option: crea la opcion. value="1": valor oculto que viaja al servidor-->
	</select>
	<!--cierra la caja del menu desplegable-->
	<br>
	<input type="submit" value="enviar">
	<!--input type="submit": es crear un boton de envio. value: es el texto que se mostrara en el boton-->
	<input type="reset" value="borrar">
	<!--input type="reset": es para crear un boton que borrara todos los campos. value: es el texto que se mostrara en el boton-->
	</form>
	<!--cierra el formulario-->
</body>
</html>
