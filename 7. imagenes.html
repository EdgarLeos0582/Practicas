<!DOCTYPE html><!-- define el documento como uno html-->
<html lang="en"> <!-- el idioma que detectara el navegador-->
<head> <!--Abre el cuadro de la cabeza de la pagina -->
    <meta charset="UTF-8"> <!--para poder usar acento y las ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Para que la pagina se acomode bien en celulares -->
    <title>Imagenes en HTML</title> <!-- El nombre que saldra en la pestaña -->
</head> <!-- Cierra la cabeza de la pagina -->
<body> <!-- abre el cuerpo de la pagina -->
    <h2>Imagenes en HTML</h2> <!-- un titulo algo grande-->
    <h3>Locales</h3> <!-- un titulo mediano-->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- importar una imagen como archivo-->
    <h3>Locales redismensionado</h3> <!-- un titulo mediano-->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- importar una imagen como archivo y cambiarle el tamaño-->
    <h3>Desde internet</h3> <!-- un titulo mediano-->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt=""> <!-- importar una imagen desde internet y cambiarle el tamaño-->
    <h3>Animaciones</h3> <!-- un titulo mediano-->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt=""> <!-- importar un gif desde internet y cambiarle el tamaño-->
</body> <!-- cierra el cuerpo de la pagina-->
</html> <!-- cierra el documento html-->
